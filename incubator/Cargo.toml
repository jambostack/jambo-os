[workspace]
resolver = "2"
members = [
    "services/*",
    "drivers/*",
    "libs/*",
]
exclude = [
    "services/jambo-forensics",
    "services/jambo-powerd",
    "services/jambo-metricsd",
    "services/jambo-bpfd",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
