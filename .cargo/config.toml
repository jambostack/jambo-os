[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tkernel/linker-x86_64.ld",
    "-C", "target-feature=-sse",
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
]

[target.x86_64-pc-windows-gnu]
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "link-self-contained=yes",
]

[alias]
xtask = "run --package xtask --"
