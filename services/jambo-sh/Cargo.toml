[package]
name = "jambo-sh"
version = "0.3.53"
edition = "2021"

[lib]
name = "jambo_sh"
path = "src/lib.rs"

[[bin]]
name = "jsh"
path = "src/main.rs"
test = false

[dependencies]
libjambo = { path = "../../libs/libjambo" }
jambo-fs = { path = "../jambo-fs" }
jambo-netd = { path = "../jambo-netd" }
jambo-fdr = { path = "../jambo-fdr" }
jambo-wasmd = { path = "../jambo-wasmd" }
jambo-pqc = { path = "../jambo-pqc" }
jambo-kdir = { path = "../jambo-kdir" }
jambo-forensics = { path = "../jambo-forensics" }
jambo-powerd = { path = "../jambo-powerd" }
jambo-metricsd = { path = "../jambo-metricsd" }
jambo-bpfd = { path = "../jambo-bpfd" }
jambo-vpn = { path = "../jambo-vpn" }
