[package]
name = "jambo-sh"
version = "0.2.47"
edition = "2021"

[lib]
name = "jambo_sh"
path = "src/lib.rs"

[[bin]]
name = "jsh"
path = "src/main.rs"

[dependencies]
jambo-aid = { path = "../jambo-aid" }
jambo-comp = { path = "../jambo-comp" }
jambo-coreutils = { path = "../jambo-coreutils" }
jambo-fs = { path = "../jambo-fs" }
jambo-linux = { path = "../jambo-linux" }
jambo-netd = { path = "../jambo-netd" }
jambo-pkgd = { path = "../jambo-pkgd" }
jambo-sdk = { path = "../../libs/jambo-sdk" }
jambo-ui = { path = "../../libs/jambo-ui" }
jambo-wasm = { path = "../jambo-wasm" }
libjambo = { path = "../../libs/libjambo" }
