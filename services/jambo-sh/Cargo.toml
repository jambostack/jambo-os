[package]
name = "jambo-sh"
version = "0.2.43"
edition = "2021"

[lib]
name = "jambo_sh"
path = "src/lib.rs"

[[bin]]
name = "jsh"
path = "src/main.rs"

[dependencies]
jambo-coreutils = { path = "../jambo-coreutils" }
jambo-fs = { path = "../jambo-fs" }
jambo-netd = { path = "../jambo-netd" }
libjambo = { path = "../../libs/libjambo" }
