[package]
name = "jambo-coreutils"
version = "0.3.92"
edition = "2021"

[lib]
name = "jambo_coreutils"
path = "src/lib.rs"

[[bin]]
name = "echo"
path = "src/bin/echo.rs"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "wc"
path = "src/bin/wc.rs"

[[bin]]
name = "true"
path = "src/bin/true.rs"

[[bin]]
name = "false"
path = "src/bin/false.rs"

[[bin]]
name = "ls"
path = "src/bin/ls.rs"

[[bin]]
name = "head"
path = "src/bin/head.rs"

[[bin]]
name = "tail"
path = "src/bin/tail.rs"

[[bin]]
name = "touch"
path = "src/bin/touch.rs"

[[bin]]
name = "mkdir"
path = "src/bin/mkdir.rs"

[[bin]]
name = "rm"
path = "src/bin/rm.rs"

[[bin]]
name = "cp"
path = "src/bin/cp.rs"

[[bin]]
name = "mv"
path = "src/bin/mv.rs"

[[bin]]
name = "tee"
path = "src/bin/tee.rs"

[[bin]]
name = "env"
path = "src/bin/env.rs"

[[bin]]
name = "grep"
path = "src/bin/grep.rs"

[dependencies]
libjambo = { path = "../../libs/libjambo" }

