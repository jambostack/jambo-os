[workspace]
resolver = "2"
members = [
    "abi/jambo-abi",
    "kernel",
    "libs/libjambo",
    "xtask",
    "services/jambo-init",
    "services/jambo-fs",
    "services/pcie-bus-mgr",
    "services/jambo-netd",
    "services/jambo-sh",
    "services/jambo-coreutils",
    "services/jambo-comp",
    "services/jambo-pkgd",
    "services/jambo-linux",
    "services/jambo-wasm",
    "services/jambo-aid",
    "services/jambo-fuzz",
    "services/jambo-rpc",
    "services/jambo-auditd",
    "services/jambo-powerd",
    "services/jambo-cryptod",
    "services/jambo-authd",
    "services/jambo-vmm",
    "services/jambo-vhostd",
    "services/jambo-timed",
    "services/jambo-raft",
    "services/jambo-kvd",
    "services/jambo-schedd",
    "services/jambo-eventd",
    "services/jambo-meshd",
    "libs/jambo-ui",
    "libs/jambo-sdk",
    "drivers/virtio",
    "drivers/nvme",
    "drivers/xhci",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
