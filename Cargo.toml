[workspace]
resolver = "2"
members = [
    "abi/jambo-abi",
    "kernel",
    "libs/libjambo",
    "drivers/virtio",
    "services/jambo-init",
    "services/jambo-sh",
    "services/jambo-blockd",
    "services/jambo-fs",
    "services/jambo-netd",
    "services/jambo-fdr",
    "services/jambo-wasmd",
    "services/jambo-pqc",
    "services/jambo-kdir",
    "services/jambo-forensics",
    "services/jambo-powerd",
    "services/jambo-metricsd",
    "services/jambo-bpfd",
    "xtask",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
