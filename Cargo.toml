[workspace]
resolver = "2"
members = [
    "abi/jambo-abi",
    "kernel",
    "libs/libjambo",
    "xtask",
    "services/jambo-init",
    "services/jambo-fs",
    "services/pcie-bus-mgr",
    "services/jambo-netd",
    "services/jambo-sh",
    "services/jambo-coreutils",
    "services/jambo-comp",
    "libs/jambo-ui",
    "drivers/virtio",
    "drivers/nvme",
    "drivers/xhci",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
