[workspace]
resolver = "2"
members = [
    "abi/jambo-abi",
    "kernel",
    "libs/libjambo",
    "drivers/virtio",
    "services/jambo-init",
    "services/jambo-sh",
    "services/jambo-blockd",
    "services/jambo-fs",
    "services/jambo-netd",
    "services/jambo-fdr",
    "services/jambo-wasmd",
    "services/jambo-pqc",
    "services/jambo-kdir",
    "services/jambo-forensics",
    "services/jambo-powerd",
    "services/jambo-metricsd",
    "services/jambo-bpfd",
    "services/jambo-vpn",
    "services/jambo-authd",
    "services/jambo-serviced",
    "services/jambo-dnsd",
    "services/jambo-timed",
    "services/jambo-auditd",
    "services/jambo-walld",
    "services/jambo-vaultd",
    "services/jambo-watchdogd",
    "services/jambo-cored",
    "services/jambo-pkgd",
    "services/jambo-certd",
    "services/jambo-policyd",
    "services/jambo-secboot",
    "services/jambo-logd",
    "xtask",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
